name: Bug report
description: Create a report to help us fix a bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the issue...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to...
        2. Click on...
        3. Scroll down to...
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Home Assistant Log Output & Server Responses
      description: Please enable debug logging for `custom_components.mast_water`, reproduce the issue, and paste relevant log output, status codes, or response JSON bodies (make sure to redact sensitive tokens/credentials!).
      placeholder: |
        <details>
        <summary>Logs & API Responses</summary>

        ```text
        Paste debug logs or server responses here...
        ```

        </details>
    validations:
      required: false
  - type: input
    id: versions
    attributes:
      label: Versions
      description: What version of Home Assistant and MAST Water integration are you running?
      placeholder: |
        - Home Assistant Core: 2025.x.x
        - Integration Version: 0.x.x
    validations:
      required: true
