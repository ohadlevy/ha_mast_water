name: Bug report
description: Create a report to help us fix a bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the issue...
    validations:
      required: true
  - type: input
    id: corporation
    attributes:
      label: Water Corporation / Tenant
      description: Which water corporation or tenant ID are you using (e.g. Mei Raanana 110, Mei Sheva 12)?
      placeholder: e.g. 12 (Mei Sheva)
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Probe Output / Home Assistant Log Output & Server Responses
      description: Please provide `mast_probe.py` output (or debug logs for `custom_components.mast_water`), ensuring sensitive tokens/credentials are redacted.
      placeholder: |
        <details>
        <summary>Probe output & Logs</summary>

        ```text
        Paste probe output or logs here...
        ```

        </details>
    validations:
      required: false
  - type: input
    id: versions
    attributes:
      label: Versions
      description: What version of Home Assistant and MAST Water integration are you running?
      placeholder: |
        - Home Assistant Core: 2025.x.x
        - Integration Version: 0.x.x
    validations:
      required: true
